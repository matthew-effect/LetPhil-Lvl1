<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive To-do List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        #tasklist {
            list-style: none;
            padding: 0;
        }

        .task {
            cursor: pointer;
            padding: 0;
            background: #f0f0f0;
            margin: 5px 0;
            border-radius: 5px;
        }

        .task:hover {
            background: #ddd;
        }
    </style>
</head>
<body>
    <h1>To-do List</h1>
    <input type="text" id="taskInput" placeholder="Enter a task" />
    <button onclick="addTask()">Add task</button>
    <ul id="taskList"></ul>

    <script src="script.js"></script>
</body>

</html>
